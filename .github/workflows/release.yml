name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, osx-x64, osx-arm64, linux-x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Self-contained, folder-based bundles per platform (the app ships
      # companion data files — targets.yaml + the bundled font — so a single-file
      # bundle isn't a good fit). .NET generates the correct apphost for each RID
      # from the downloaded runtime pack, so every target cross-publishes from one
      # Linux runner. The GUI and CLI publish into the same folder and share the
      # runtime; only their two apphosts differ.
      - name: Publish GUI app
        run: >
          dotnet publish src/ScreenGen.App/ScreenGen.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:DebugType=None -p:DebugSymbols=false
          -o dist/${{ matrix.rid }}

      - name: Publish CLI
        run: >
          dotnet publish src/ScreenGen/ScreenGen.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:DebugType=None -p:DebugSymbols=false
          -o dist/${{ matrix.rid }}

      - name: Strip native debug symbols
        run: rm -f dist/${{ matrix.rid }}/*.pdb

      - name: Package
        run: |
          cd dist/${{ matrix.rid }}
          zip -r "../../ScreenGen-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenGen-${{ matrix.rid }}
          path: ScreenGen-${{ matrix.rid }}.zip

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
